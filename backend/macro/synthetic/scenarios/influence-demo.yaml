# Cho bản đồ ảnh hưởng (spec influence-map mục 3): trung tâm VN-Index chịu ba quan hệ gài sẵn,
# và 12 tháng cuối có Brent tăng, USD giảm, tín dụng tăng. Lợi suất Mỹ không gài quan hệ.
extends: baseline
name: influence-demo
title: Bản đồ ảnh hưởng — Brent kéo xuống, USD giảm đẩy lên
start: 1990-01  # mẫu dài hơn baseline: ước lượng từng cặp đủ chắc ở tầm 12
series:  # nhiễu tháng nhỏ hơn baseline để cú sốc cuối kỳ nổi rõ
  global.brent: {process: ar1, mean: 0, phi: 0, sd: 3}
  us.usd_broad: {process: ar1, mean: 0, phi: 0, sd: 1}
  vn.credit_growth: {process: ar1, mean: 0, phi: 0, sd: 0.4}
  vn.vnindex: {process: random_walk, start: 709, sd: 0.5}
relations:
  - {outcome: vn.pmi_mfg, shock: global.brent, beta: 0.2, lag: 1}
  - {outcome: vn.vnindex, shock: global.brent, beta: -0.5, lag: 1}
  - {outcome: vn.vnindex, shock: us.usd_broad, beta: -1.3, lag: 1}
  - {outcome: vn.vnindex, shock: vn.credit_growth, beta: 3.0, lag: 1}
  - {outcome: vn.gdp_yoy, shock: global.demand, beta: 0.15, lag: 2}
events:  # mỗi yếu tố một cú sốc lớn ở tháng riêng gần cuối kỳ (cùng tháng thì mô hình từng cặp đếm trùng)
  - {series: global.brent, period: 2036-08, add: 40}
  - {series: us.usd_broad, period: 2036-10, add: -12}
  - {series: vn.credit_growth, period: 2036-09, add: 5}
missing: [vn.cpi_yoy_long]
