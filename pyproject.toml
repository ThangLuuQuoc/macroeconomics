[project]
name = "macroeconomics"
version = "0.1.0"
description = "Theo dõi và giả lập kinh tế vĩ mô Việt Nam"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/macro"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]
extend-exclude = [".proofline"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["backend"]
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["statsmodels", "statsmodels.*"]
ignore_missing_imports = true  # statsmodels không có stub kiểu

[tool.pytest.ini_options]
testpaths = ["tests"]
